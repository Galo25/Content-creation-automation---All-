<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="navybg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1F3A"/>
      <stop offset="100%" style="stop-color:#132C52"/>
    </linearGradient>
    <linearGradient id="photoOverlay" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1F3A;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#0B1F3A;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="photoBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1F3A;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0B1F3A;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="goldBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F0C93A"/>
      <stop offset="100%" style="stop-color:#C9A227"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect x="0" y="0" width="290" height="600"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#navybg)"/>

  <!-- PHOTO PANEL (left 285px) — simulated with a realistic medical scene -->
  <!-- Hospital corridor background -->
  <rect x="0" y="0" width="290" height="600" fill="#b8ccd8"/>
  <!-- Corridor walls -->
  <rect x="0" y="0" width="290" height="600" fill="#c5d8e8" opacity="0.6"/>
  <!-- Floor -->
  <rect x="0" y="420" width="290" height="180" fill="#9bb5c8" opacity="0.5"/>
  <!-- Background depth lines -->
  <rect x="60" y="0" width="4" height="600" fill="#a8c0d0" opacity="0.4"/>
  <rect x="200" y="0" width="3" height="600" fill="#a8c0d0" opacity="0.3"/>

  <!-- Doctor silhouette (left figure, taller) -->
  <!-- Body / white coat -->
  <ellipse cx="118" cy="480" rx="52" ry="130" fill="#f0f0f0"/>
  <!-- Head -->
  <circle cx="118" cy="195" r="38" fill="#d4956b"/>
  <!-- White hair -->
  <ellipse cx="118" cy="175" rx="36" ry="20" fill="#e8e4e0"/>
  <!-- Glasses -->
  <rect x="100" y="200" width="15" height="10" rx="3" fill="none" stroke="#555" stroke-width="2"/>
  <rect x="118" y="200" width="15" height="10" rx="3" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="115" y1="205" x2="118" y2="205" stroke="#555" stroke-width="1.5"/>
  <!-- Tie -->
  <polygon points="118,235 122,300 118,310 114,300" fill="#8B3A3A"/>
  <!-- Stethoscope -->
  <path d="M100,250 Q90,280 95,310 Q100,330 110,320" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <circle cx="110" cy="322" r="8" fill="#555"/>
  <!-- Arm holding clipboard -->
  <rect x="125" y="290" width="28" height="90" rx="8" fill="#e0e0e0" transform="rotate(-20,140,330)"/>
  <!-- Clipboard -->
  <rect x="128" y="310" width="42" height="52" rx="4" fill="#d0d8e0"/>
  <rect x="128" y="310" width="42" height="8" rx="2" fill="#888"/>
  <line x1="133" y1="328" x2="165" y2="328" stroke="#aaa" stroke-width="1.5"/>
  <line x1="133" y1="336" x2="160" y2="336" stroke="#aaa" stroke-width="1.5"/>
  <line x1="133" y1="344" x2="162" y2="344" stroke="#aaa" stroke-width="1.5"/>
  <line x1="133" y1="352" x2="155" y2="352" stroke="#aaa" stroke-width="1.5"/>

  <!-- Patient silhouette (right figure, shorter, looking at clipboard) -->
  <!-- Body -->
  <ellipse cx="200" cy="490" rx="45" ry="115" fill="#e07060"/>
  <!-- Head -->
  <circle cx="200" cy="210" r="34" fill="#c8855a"/>
  <!-- Short silver hair -->
  <ellipse cx="200" cy="194" rx="32" ry="18" fill="#d5d0cd"/>
  <!-- Small glasses -->
  <rect x="186" y="214" width="12" height="8" rx="2" fill="none" stroke="#666" stroke-width="1.5"/>
  <rect x="200" y="214" width="12" height="8" rx="2" fill="none" stroke="#666" stroke-width="1.5"/>
  <line x1="198" y1="218" x2="200" y2="218" stroke="#666" stroke-width="1.2"/>
  <!-- Necklace -->
  <path d="M185,258 Q200,268 215,258" fill="none" stroke="#c4a55a" stroke-width="2"/>

  <!-- Gradient overlay: right fade to navy -->
  <rect x="0" y="0" width="290" height="600" fill="url(#photoOverlay)"/>
  <!-- Bottom gradient -->
  <rect x="0" y="400" width="290" height="200" fill="url(#photoBottom)"/>

  <!-- Photo badge bottom-left -->
  <rect x="12" y="546" width="190" height="42" rx="8" fill="rgba(11,31,58,0.85)"/>
  <rect x="12" y="546" width="190" height="42" rx="8" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  <text x="22" y="563" font-family="Arial" font-size="10" font-weight="700" fill="#D4AF37" letter-spacing="0.5">Talk to a Licensed Agent</text>
  <text x="22" y="578" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.6)">Free · No obligation</text>

  <!-- COPY PANEL (right side) -->
  <!-- Decorative circle -->
  <circle cx="570" cy="50" r="100" fill="#D4AF37" opacity="0.05"/>

  <!-- Eyebrow pill -->
  <rect x="308" y="30" width="140" height="26" rx="13" fill="rgba(212,175,55,0.12)"/>
  <rect x="308" y="30" width="140" height="26" rx="13" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <text x="378" y="48" font-family="Arial" font-size="10" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">MEDICARE UPDATE 2026</text>

  <!-- Headline -->
  <text x="308" y="96" font-family="Arial" font-size="28" font-weight="900" fill="white">You May Qualify</text>
  <text x="308" y="130" font-family="Arial" font-size="28" font-weight="900" fill="white">for <tspan fill="#D4AF37">$0/Month</tspan></text>
  <text x="308" y="164" font-family="Arial" font-size="28" font-weight="900" fill="white">Medicare</text>

  <!-- Price comparison -->
  <text x="308" y="210" font-family="Arial" font-size="20" font-weight="800" fill="rgba(255,255,255,0.3)" text-decoration="line-through">$202/mo</text>
  <line x1="308" y1="202" x2="392" y2="202" stroke="#e53e3e" stroke-width="2.5"/>
  <text x="408" y="210" font-family="Arial" font-size="18" fill="#D4AF37">→</text>
  <text x="432" y="228" font-family="Arial" font-size="46" font-weight="900" fill="#D4AF37">$0</text>
  <text x="474" y="228" font-family="Arial" font-size="18" font-weight="600" fill="rgba(212,175,55,0.75)">/mo</text>

  <!-- Body copy -->
  <text x="308" y="260" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.9)" font-weight="700">98% of seniors</text>
  <text x="392" y="260" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.65)"> qualify for a</text>
  <text x="308" y="276" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.65)">$0-premium plan. Most include:</text>

  <!-- Benefits list -->
  <!-- Dental -->
  <circle cx="320" cy="308" r="10" fill="rgba(212,175,55,0.2)"/>
  <circle cx="320" cy="308" r="10" fill="none" stroke="rgba(212,175,55,0.5)" stroke-width="1"/>
  <text x="320" y="313" font-family="Arial" font-size="10" font-weight="700" fill="#D4AF37" text-anchor="middle">✓</text>
  <text x="338" y="313" font-family="Arial" font-size="12.5" font-weight="600" fill="rgba(255,255,255,0.85)">Free Dental</text>
  <!-- Vision -->
  <circle cx="320" cy="336" r="10" fill="rgba(212,175,55,0.2)"/>
  <circle cx="320" cy="336" r="10" fill="none" stroke="rgba(212,175,55,0.5)" stroke-width="1"/>
  <text x="320" y="341" font-family="Arial" font-size="10" font-weight="700" fill="#D4AF37" text-anchor="middle">✓</text>
  <text x="338" y="341" font-family="Arial" font-size="12.5" font-weight="600" fill="rgba(255,255,255,0.85)">Free Vision</text>
  <!-- Hearing -->
  <circle cx="320" cy="364" r="10" fill="rgba(212,175,55,0.2)"/>
  <circle cx="320" cy="364" r="10" fill="none" stroke="rgba(212,175,55,0.5)" stroke-width="1"/>
  <text x="320" y="369" font-family="Arial" font-size="10" font-weight="700" fill="#D4AF37" text-anchor="middle">✓</text>
  <text x="338" y="369" font-family="Arial" font-size="12.5" font-weight="600" fill="rgba(255,255,255,0.85)">Free Hearing</text>
  <!-- Rx -->
  <circle cx="320" cy="392" r="10" fill="rgba(212,175,55,0.2)"/>
  <circle cx="320" cy="392" r="10" fill="none" stroke="rgba(212,175,55,0.5)" stroke-width="1"/>
  <text x="320" y="397" font-family="Arial" font-size="10" font-weight="700" fill="#D4AF37" text-anchor="middle">✓</text>
  <text x="338" y="397" font-family="Arial" font-size="12.5" font-weight="600" fill="rgba(255,255,255,0.85)">Rx Coverage</text>

  <!-- CTA Button -->
  <rect x="296" y="430" width="282" height="52" rx="26" fill="url(#goldBtn)"/>
  <text x="437" y="462" font-family="Arial" font-size="14" font-weight="900" fill="#0B1F3A" text-anchor="middle" letter-spacing="0.5">CHECK MY ELIGIBILITY →</text>

  <!-- Disclaimer -->
  <text x="437" y="502" font-family="Arial" font-size="9.5" fill="rgba(255,255,255,0.3)" text-anchor="middle">Plans vary by location. Licensed agents available.</text>
  <text x="437" y="516" font-family="Arial" font-size="9.5" fill="rgba(255,255,255,0.3)" text-anchor="middle">Not affiliated with any government agency.</text>
</svg>
